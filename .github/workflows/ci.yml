name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.4.1"
          poetry --version

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pypoetry
            ~/.cache/pip
          key: ${{ runner.os }}-py311-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-py311-poetry-

      - name: Install dependencies
        run: poetry install --no-interaction
        
      - name: Validate public release outputs
        run: poetry run python scripts/validate_final_outputs.py

      - name: Check publication artifacts
        run: poetry run python scripts/validate_final_outputs.py --publication-only

      - name: Run tests
        run: poetry run python -m pytest

      - name: Run Ruff
        run: poetry run python -m ruff check --no-cache last_mile scripts tests

      - name: Check repository diff
        run: git diff --check
