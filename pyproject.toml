[project]
name = "last-mile"
version = "0.1.0"
description = "Statistical research on how delivery-zone and work-mode changes affect delivery speed and funnel conversions."
authors = [
    { name = "Vladislav Olegovich Lytkin" },
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pandas (>=2.2,<3.0)",
    "numpy (>=1.26,<3.0)",
    "matplotlib (>=3.8,<4.0)",
    "seaborn (>=0.13,<1.0)",
    "h3 (>=4.0,<5.0)",
    "jupyterlab (>=4.0,<5.0)",
    "nbconvert (>=7.0,<8.0)",
    "nbclient (>=0.9,<1.0)",
    "nbformat (>=5.10,<6.0)",
    "tqdm (>=4.67,<5.0)",
    "linearmodels (>=7.0,<8.0)",
    # Version confirmed from local environment: differences.__version__ == "0.3.0"
    "differences (==0.3.0)",
    "scipy (>=1.11,<2.0)",
    "statsmodels (>=0.14,<1.0)",
]

[tool.poetry]
packages = [{ include = "last_mile" }]

[tool.poetry.group.dev.dependencies]
dvc = { extras = ["s3"], version = "^3.0" }
ruff = "^0.15"
pytest = "^9.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
